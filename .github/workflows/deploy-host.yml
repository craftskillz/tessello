# At each push to main, checks Tessello, builds the Host and runs its browser tests against the build, then deploys it
# to the Cloudflare Pages project tessello, served at https://tessello.pages.dev/ (see DEPLOYING.md).

name: Deploy the Host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-host
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium

      # Builds packages/host/dist, then tests it served with the headers of _headers, as Cloudflare Pages serves it.
      - run: npm run test:browser

      - uses: actions/upload-artifact@v7
        with:
          name: host
          path: packages/host/dist
          include-hidden-files: true

  # A job of its own, so the Cloudflare token never meets the job that installed the dependencies. It waits for the
  # repository variable CLOUDFLARE_ACCOUNT_ID: until the Maintainer sets it, the Host stays an artifact of the run.
  deploy:
    needs: build
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: host
          path: host

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy host --project-name tessello --branch main --commit-hash "$GITHUB_SHA"
