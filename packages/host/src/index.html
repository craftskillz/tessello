<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tessello</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <section id="gate" class="gate" hidden></section>
    <nav class="launcher" id="launcher" aria-label="Launcher" hidden>
      <button type="button" class="launcher-home" id="home-button">Tessello</button>
      <ul id="launcher-modules"></ul>
      <label class="launcher-install">
        Install a Module…
        <input type="file" id="install-file" accept=".zip,application/zip" hidden />
      </label>
      <button type="button" class="launcher-folder" id="folder-button">Modules folder</button>
    </nav>
    <main id="stage" hidden>
      <section id="home" class="home">
        <h1>Your space is ready</h1>
        <p>
          Drop a Module's <code>.zip</code> file anywhere on this page to install it, or place a Module's folder in your
          Modules folder.
        </p>
      </section>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
