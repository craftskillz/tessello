<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tessello</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <section id="gate" class="gate" hidden></section>
    <div class="launcher-edge" aria-hidden="true"></div>
    <nav class="launcher" id="launcher" aria-label="Launcher" data-i18n-label="launcher" hidden>
      <button type="button" class="launcher-home" id="home-button">Tessello</button>
      <ul id="launcher-modules"></ul>
      <button type="button" class="launcher-marketplace" id="marketplace-button" data-i18n="marketplace">Marketplace</button>
      <div class="launcher-tools" id="launcher-tools">
        <button type="button" class="launcher-tools-toggle" id="launcher-tools-toggle" aria-expanded="false" aria-controls="launcher-tools-panel">
          <span data-i18n="launcherManage">Manage</span>
          <svg class="launcher-tools-chevron" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6" /></svg>
        </button>
        <div class="launcher-tools-panel" id="launcher-tools-panel" inert aria-hidden="true">
          <div class="launcher-tools-actions">
            <button type="button" class="launcher-install" id="install-file-button" data-i18n="installModule">Install a Module…</button>
            <input type="file" id="install-file" accept=".zip,application/zip" hidden />
            <button type="button" class="launcher-install" id="install-url-button" data-i18n="installFromUrl">Install from a URL…</button>
            <button type="button" class="launcher-settings" id="settings-button" data-i18n="settings">Settings</button>
            <button type="button" class="launcher-folder" id="folder-button">Modules folder</button>
          </div>
        </div>
      </div>
    </nav>
    <main id="stage" hidden>
      <section id="home" class="home">
        <div id="home-empty" class="home-empty">
          <h1 data-i18n="homeEmptyTitle">Your space is ready</h1>
          <p id="home-empty-text"></p>
        </div>
        <div class="home-toolbar">
          <button type="button" id="arrange-button" data-i18n="arrangeWidgets" hidden>Arrange widgets</button>
        </div>
        <ol id="widgets" class="widgets" aria-label="Widgets" data-i18n-label="widgets"></ol>
      </section>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  </body>
</html>
